version: '3.8'

services:
  aistudio-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aistudio-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - HTTP_PORT=3000
      - LOG_LEVEL=info
      - STREAMING_MODE=real
      - SWITCH_ON_FAILURE=true
      - SWITCH_ON_USES=10
      - MAX_RETRIES=3
      - RETRY_DELAY=1000
      - BROWSER_TIMEOUT=120000
      - REQUEST_TIMEOUT=300000
      - IMMEDIATE_SWITCH_STATUS_CODES=429,503
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - browser-data:/app/browser-data
    shm_size: 1gb
    mem_limit: 2g
    mem_reservation: 1g
    cpu_shares: 1024
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aistudio-network

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: aistudio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - aistudio-proxy
    networks:
      - aistudio-network
    profiles:
      - production

  # 监控服务（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: aistudio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - aistudio-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: aistudio-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aistudio-network
    profiles:
      - monitoring

volumes:
  browser-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  aistudio-network:
    driver: bridge